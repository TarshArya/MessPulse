<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My QR - MessPulse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            padding: 30px 16px;
        }

        .card {
            width: 100%;
            max-width: 390px;
            background: white;
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            color: #2E7D32;
            margin-bottom: 8px;
        }

        p {
            color: #555;
            font-size: 14px;
            margin-bottom: 18px;
        }

        img {
            width: 240px;
            height: 240px;
            object-fit: contain;
            margin: 10px 0 16px;
        }

        .token {
            font-size: 13px;
            color: #777;
            word-break: break-all;
            margin-bottom: 20px;
        }

        a {
            display: inline-block;
            padding: 12px 18px;
            background: #2E7D32;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>My QR Code</h1>
        <p>Show this QR to the admin during meal service.</p>

        <img src="data:image/png;base64,{{ qr_image }}" alt="My QR Code">
        <div class="token">{{ qr_token }}</div>

        <a href="{{ url_for('home') }}">Back to Home</a>
    </div>
</body>
</html>
