<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="login-body">

<div class="login-container">
    <div class="login-card">
        
        <img src="{{ url_for('static', filename='assets/Logo.png') }}" class="logo">

        <h2>Welcome Back!</h2>
        <p class="subtext">Admin Login</p>

        <form method="POST" action="/admin/login">
            <div class="input-group">
                <input class = "btn" name = "email" type="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <input class = "btn" name = "password" type="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="login-btn">Log in</button>
        </form>

    </div>
</div>

</body>
</html>
